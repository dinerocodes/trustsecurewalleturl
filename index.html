<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Wallet- Trust wallet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            max-width: 480px;
        }

        .wallet-img {
            width: 250px;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
            margin-top: -6rem;
        }

        p {
            color: #666;
            font-size: 16px;
            margin-top: -1rem;
            margin-bottom: 15rem;
        }

        button {
            background-color: #0045ff;
            color: white;
            border: none;
            padding: 12px 80px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        button:hover {
            background-color: #0035cc;
        }

        a {
            display: block;
            color: #0045ff;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="./image.png" alt="Crypto Wallet Icon" class="wallet-img" />
        <h1>Private and Secure</h1>
        <p>Private keys never leave your device.</p>
        <a href='/login-wallet.html'><button>Create a New Wallet</button></a>
        <a href='/login.html'>I already have a wallet</a>
    </div>
</body>

</html>
