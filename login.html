<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypto Wallet- Trust wallet</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background: #f7f7f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 410px;
            width: 100%;
            text-align: center;
        }

        .logo {
            width: 100px;
            margin-top: 5rem;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px 14px 14px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .input-group .eye-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            opacity: 0.5;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #c5b4f7;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b0a1e0;
        }

        .help-text {
            margin-top: 5rem;
            font-size: 13px;
            color: #666;
        }

        .reset-link {
            display: block;
            margin-top: 6px;
            font-weight: bold;
            color: #00aa00;
            text-decoration: none;
        }

        .reset-link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="login-container">
        <img src="./tw.png" alt="Trust Logo" class="logo">
        <h2>Secure and trusted multi-chain crypto wallet</h2>

        <div class="input-group">
            <input type="text" id="email" placeholder="Email Address" required>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Secret Phrase" required>
            <span class="eye-icon" onclick="togglePassword()">👁️</span>
        </div>

        <button onclick="handleLogin()">Unlock</button>

        <div class="error-message" id="errorMsg"></div>

        <div class="help-text">
            Can't login? You can erase your current wallet and set up a new one.
            <a href="#" class="reset-link">Reset wallet</a>
        </div>
    </div>

    <script>
        const validEmail = "jerryjunior11330@gmail.com"; // ✅ Set your email here
        const validPassword = "Inheritancemoney"; // ✅ Set your password here

        function handleLogin() {
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const errorMsg = document.getElementById("errorMsg");

            if (email === validEmail && password === validPassword) {
                // Login successful → redirect
                window.location.href = "phares.html"; // Replace with your target page
            } else {
                // Show error
                errorMsg.textContent = "Invalid email or password.";
            }
        }

        function togglePassword() {
            const pwField = document.getElementById("password");
            if (pwField.type === "password") {
                pwField.type = "text";
            } else {
                pwField.type = "password";
            }
        }
    </script>

</body>

</html>
